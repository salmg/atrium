# Book 2 minimum data, MACed directly under the UDK with no session key.
#
# Older schemes sign the AC under the card key itself rather than deriving a
# per-transaction session key. Worth trying when a profile verifies nothing and
# the ATC looks like it is not participating in the derivation.
name: udk-direct
description: Book 2 data with no session-key derivation — MACed under the UDK.
session_key: none
padding: iso9797-2

